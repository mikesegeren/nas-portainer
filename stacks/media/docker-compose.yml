version: "3.9"

services:
  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/jellyfin/config:/config
      - ${MEDIA_PATH}:/media
    ports:
      - 8096:8096
      - 8920:8920
    restart: unless-stopped

  ombi:
    image: linuxserver/ombi
    container_name: ombi
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ombi/config:/config
    ports:
      - 3579:3579
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/sonarr/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/radarr/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/lidarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8686:8686
    restart: unless-stopped

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/lazylibrarian/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 5299:5299
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  qbittorrent:
    image: binhex/arch-qbittorrentvpn
    container_name: qbittorrent-vpn
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VPN_ENABLED=yes
      - VPN_PROV=nordvpn
      - LAN_NETWORK=${LAN_NETWORK}
      - VPN_USER=${VPN_USER}
      - VPN_PASS=${VPN_PASS}
      - WEBUI_PORT=8090
    volumes:
      - ${DOCKER_DATA}/qbittorrent/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8090:8090
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/sabnzbd/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8081:8080
    restart: unless-stopped

  # Imports books dropped in books-ingest (files there are DELETED after import),
  # converts to kepub and serves them to the Kobo via Kobo sync.
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/calibre-web-automated/config:/config
      - ${MEDIA_PATH}/books-ingest:/cwa-book-ingest
      - ${MEDIA_PATH}/books:/calibre-library
    ports:
      - 8083:8083
    restart: unless-stopped

  # Runs as root (upstream default): with `user:` Docker creates missing bind dirs as root and ABS can't write them.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/audiobookshelf/config:/config
      - ${DOCKER_DATA}/audiobookshelf/metadata:/metadata
      - ${MEDIA_PATH}/audiobooks:/audiobooks
    ports:
      - 13378:80
    restart: unless-stopped
