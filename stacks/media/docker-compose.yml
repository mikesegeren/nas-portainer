services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/jellyfin/config:/config
      - ${MEDIA_PATH}:/media
    ports:
      - 8096:8096
      - 8920:8920
    restart: unless-stopped

  # Seerr (successor of Jellyseerr) runs as UID 1000: create and chown ${DOCKER_DATA}/seerr/config to 1000:1000 first.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/seerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/sonarr/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/radarr/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/lidarr:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8686:8686
    restart: unless-stopped

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/lazylibrarian/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 5299:5299
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/sabnzbd/config:/config
      - ${MEDIA_PATH}:/data
    ports:
      - 8081:8080
    restart: unless-stopped

  # Imports books dropped in books-ingest (files there are DELETED after import),
  # converts to kepub and serves them to the Kobo via Kobo sync.
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/calibre-web-automated/config:/config
      - ${MEDIA_PATH}/books-ingest:/cwa-book-ingest
      - ${MEDIA_PATH}/books:/calibre-library
    ports:
      - 8083:8083
    restart: unless-stopped

  # Runs as root (upstream default): with `user:` Docker creates missing bind dirs as root and ABS can't write them.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/audiobookshelf/config:/config
      - ${DOCKER_DATA}/audiobookshelf/metadata:/metadata
      - ${MEDIA_PATH}/audiobooks:/audiobooks
    ports:
      - 13378:80
    restart: unless-stopped
