networks:
  default:
    name: infra-network
    driver: bridge

services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "8088:80"
    networks:
      - default

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ${DOCKER_DATA}/glance/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    networks:
      - default

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "8880:80"
      - "8443:443"
      - "81:81"
    volumes:
      - ${DOCKER_DATA}/nginx-proxy-manager/data:/data
      - ${DOCKER_DATA}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - default

  # Checks for new image versions every 6h. Notifies only, never updates.
  # No notifier configured yet: results show in the container logs.
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    command: serve
    volumes:
      - ${DOCKER_DATA}/diun/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
    networks:
      - default
